<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Money Manager</title>
    <meta name="description"
          content="Offline-first personal finance manager" />

    <!-- Icons -->
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="/favicon-32x32.png" />
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="/favicon-16x16.png" />
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="/apple-touch-icon.png" />

    <!--
      Browser chrome colour. The single plain tag is kept in sync with the active
      theme by the settings store (see applyTheme), so it must not use media queries.
    -->
    <meta name="theme-color"
          content="#ffffff" />

    <!-- Standalone / installable app support (iOS ignores most of the web manifest) -->
    <meta name="apple-mobile-web-app-capable"
          content="yes" />
    <meta name="mobile-web-app-capable"
          content="yes" />
    <meta name="apple-mobile-web-app-title"
          content="Money" />
    <meta name="apple-mobile-web-app-status-bar-style"
          content="default" />

    <!-- The web manifest link is injected by vite-plugin-pwa at build time. -->
</head>

<body>
    <div id="app"></div>
    <script type="module"
            src="/src/main.js"></script>
</body>

</html>
